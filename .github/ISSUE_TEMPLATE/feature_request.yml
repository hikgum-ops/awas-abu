name: Feature request
description: Propose a focused improvement while preserving safety boundaries.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who needs this and what is difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful change and its failure behavior.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Official source or dataset
      description: If the proposal interprets hazard or boundary data, link its official source and state what it can establish.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: Missing or stale data will not be presented as safe.
          required: true
        - label: The proposal does not add automatic evacuation instructions or subscriber broadcasts.
          required: true
        - label: The proposal avoids storing precise GPS, messages, phone numbers, and credentials.
          required: true
